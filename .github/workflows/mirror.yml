name: mirror-from-cedwyn
# This workflow is only for apps whose authoritative split manifest says mode: mirror.
# The manifest lives in unclehowell/cedwyn/main. A missing/unreadable manifest fails closed:
# never assume mirror mode, because that could overwrite this repository's main branch.
on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/mirror.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read authoritative split manifest
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://raw.githubusercontent.com/unclehowell/cedwyn/main/split-repos.json?cb=$(date +%s)" \
            -o /tmp/split-repos.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d = json.loads(Path("/tmp/split-repos.json").read_text())
          matches = [a for a in d.get("apps", []) if a.get("repo") == "unclehowell/cedwyn-tithe-h3"]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one manifest entry; found {len(matches)}")
          app = matches[0]
          mode = app.get("mode")
          branch = app.get("old_branch")
          deploy = app.get("deploy")
          if mode not in ("mirror", "split-repo"):
              raise SystemExit(f"missing or unknown mode: {mode!r}")
          if not branch:
              raise SystemExit("manifest entry has no old_branch")
          print(f"mode={mode}")
          print(f"old_branch={branch}")
          print(f"should_mirror={'true' if mode == 'mirror' and deploy != 'repo' else 'false'}")
          PY
          echo "Authoritative mode loaded."
      - uses: actions/checkout@v4
        if: steps.mode.outputs.should_mirror == 'true'
        with: { ref: main, fetch-depth: 1 }
      - name: Copy the authoritative legacy branch (mirror mode only)
        if: steps.mode.outputs.should_mirror == 'true'
        env:
          SOURCE_REPO: unclehowell/cedwyn
          SOURCE_BRANCH: ${{ steps.mode.outputs.old_branch }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --single-branch --branch "$SOURCE_BRANCH" \
            "https://github.com/$SOURCE_REPO.git" /tmp/src
          SRC_SHA=$(git -C /tmp/src rev-parse HEAD)
          [ -f /tmp/src/README.md ] && cp /tmp/src/README.md APP-README.md || true
          rsync -a --delete --exclude .git --exclude .github --exclude README.md --exclude APP-README.md --exclude SPLIT.json /tmp/src/ ./
          printf '{"source":"%s","branch":"%s","sha":"%s","copied_utc":"%s"}\n' \
            "$SOURCE_REPO" "$SOURCE_BRANCH" "$SRC_SHA" "$(date -u +%FT%TZ)" > SPLIT.json
          git add -A
          if git diff --cached --quiet -- . ':!SPLIT.json'; then
            echo "no change since $SOURCE_REPO/$SOURCE_BRANCH@$SRC_SHA"
            exit 0
          fi
          git -c user.name="cedwyn-mirror" -c user.email="actions@users.noreply.github.com" \
            commit -q -m "Mirror $SOURCE_BRANCH@${SRC_SHA:0:7} from $SOURCE_REPO"
          git push origin HEAD:main
      - name: Skip — dedicated repo is authoritative
        if: steps.mode.outputs.should_mirror != 'true'
        run: echo "No mirror: dedicated repository remains authoritative."
