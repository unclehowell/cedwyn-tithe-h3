name: API contract tests

on:
  pull_request:
    paths:
      - 'functions/**'
      - 'test/api-contract.test.mjs'
      - 'docs/APP-API-PILOT.md'
      - 'data/view.json'
      - 'data/pins.json'
      - 'tools/sync_central.py'
      - '.github/workflows/api-contract.yml'
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'test/api-contract.test.mjs'
      - 'docs/APP-API-PILOT.md'
      - '.github/workflows/api-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check functions/_shared/api.mjs
          node --check functions/index.js
          node --check functions/api/v1.js
          node --check functions/mcp.js
      - name: Validate generated app-view contract
        run: |
          python3 -m py_compile tools/sync_central.py
          python3 -c "import json; v=json.load(open('data/view.json')); assert v['schema']=='cedwyn.app-view/v1'; assert v['app']['id']=='tithe-h3'; assert v['catalogue']['count']==len(v['catalogue']['items']); assert len(v['map']['pins']['records'])>0"
      - name: Contract and security tests
        run: node --test test/api-contract.test.mjs
