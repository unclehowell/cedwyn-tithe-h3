name: preview
# Cloudflare Pages preview for every pull request (adapted from datro's deploy-qa.yml `wrangler pages deploy --branch`).
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (the names datro uses). Without them the job
# reports that and stops; nothing else runs. Posts ONE comment with the preview link. Never merges. - Sion's Tab agent
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check functions/_shared/api.mjs
          node --check functions/index.js
          node --check functions/api/v1.js
          node --check functions/mcp.js
          python3 -m py_compile tools/sync_central.py
      - name: View schema and API contract
        run: |
          python3 -c "import json; v=json.load(open('data/view.json')); assert v['schema']=='cedwyn.app-view/v1'; assert v['app']['id']=='tithe-h3'; assert v['catalogue']['count']==len(v['catalogue']['items']); assert len(v['map']['pins']['records'])>0"
          node --test test/api-contract.test.mjs

  preview-smoke:
    needs: contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for the Cloudflare Pages Git preview
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          SLUG="$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-28)"
          URL="https://${SLUG}.cedwyn-tithe-h3.pages.dev"
          echo "Testing $URL"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$URL/data/view.json" -o /tmp/view.json; then
              echo "PREVIEW_URL=$URL" >> "$GITHUB_ENV"
              break
            fi
            if [ "$attempt" -eq 30 ]; then echo "Cloudflare Pages preview did not become reachable"; exit 1; fi
            sleep 10
          done
      - name: Test app view and JSON/XML endpoints
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          v=json.load(open('/tmp/view.json'))
          assert v['schema']=='cedwyn.app-view/v1'
          assert v['app']['id']=='tithe-h3'
          assert v['catalogue']['count']==len(v['catalogue']['items'])
          assert len(v['map']['pins']['records'])>0
          PY
          curl --fail --silent --show-error -H 'Accept: application/json' "$PREVIEW_URL/api/v1" -o /tmp/api.json
          curl --fail --silent --show-error -H 'Accept: application/xml' "$PREVIEW_URL/api/v1?format=xml" -o /tmp/api.xml
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/api.json'))
          assert p['dataset']['mode']=='app-view'
          assert p['items'] and p['pagination']['total']>0
          assert all(x['source']['type']=='central-catalogue' for x in p['items'])
          assert 'PRIVATE_CANARY' not in open('/tmp/api.json').read()
          assert '<cedwyn-api ' in open('/tmp/api.xml').read()
          PY
      - name: Test MCP resource read
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PREVIEW_URL/mcp" \
            -H 'content-type: application/json' \
            -H 'mcp-protocol-version: 2025-11-25' \
            --data '{"jsonrpc":"2.0","id":1,"method":"resources/read","params":{"uri":"cedwyn://tithe-h3/catalogue"}}' \
            -o /tmp/mcp.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/mcp.json'))
          assert r['result']['contents'][0]['uri']=='cedwyn://tithe-h3/catalogue'
          p=json.loads(r['result']['contents'][0]['text'])
          assert p['dataset']['mode']=='app-view'
          assert p['items']
          PY

  preview:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: cedwyn-tithe-h3
    steps:
      - name: Secrets present?
        id: s
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; no preview."; echo ok=0 >> "$GITHUB_OUTPUT"; else echo ok=1 >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.s.outputs.ok == '1'
        with: { fetch-depth: 1 }
      - name: Deploy preview
        if: steps.s.outputs.ok == '1'
        id: d
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BR: ${{ github.head_ref || github.ref_name }}
        run: |
          DIR=.; [ -d public ] && DIR=public
          rm -rf .git .github
          npx -y wrangler@3 pages project create "$PROJECT" --production-branch main >/dev/null 2>&1 || true
          npx -y wrangler@3 pages deploy "$DIR" --project-name "$PROJECT" --branch "$BR" --commit-dirty=true | tee /tmp/out.txt
          URL=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' /tmp/out.txt | tail -1); echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Comment
        if: steps.s.outputs.ok == '1' && github.event.pull_request.number && steps.d.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = `Preview: ${{ steps.d.outputs.url }}\n\n(Cloudflare Pages, updated on every push to this PR.)`;
            const {owner, repo} = context.repo; const issue_number = context.payload.pull_request.number;
            const cs = await github.rest.issues.listComments({owner, repo, issue_number});
            const mine = cs.data.find(c => c.body.startsWith('Preview: '));
            if (mine) await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number, body});
